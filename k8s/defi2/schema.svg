<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" width="1600" height="1180" font-family="Verdana, 'DejaVu Sans', 'Segoe UI', Arial, sans-serif">
<title>Défi 2 : Deployment à trois répliques, Service ClusterIP et kubectl proxy</title>
<defs>
<marker id="m-or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0965e"/></marker>
</defs>
<rect width="1600" height="1180" rx="16" fill="#0c0b09"/>
<text x="50" y="46"><tspan fill="#c0965e" font-size="24" font-weight="600" letter-spacing="3">CINETINT</tspan><tspan dx="16" fill="#a39c90" font-size="15">défi 2 : trois pods, un Service ClusterIP, un nom DNS, accès par kubectl proxy</tspan></text>
<rect x="60" y="64" width="480" height="66" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
