# Défi 11 : NetworkPolicy, seuls les pods autorisés joignent PostgreSQL.
# Valeurs cumulatives : ce fichier contient l'état complet voulu à la fin du défi.
# Utilisation : helm upgrade --install cinetint ../helm/cinetint -n u-XXX -f ../helm/cinetint/values-cours.yaml -f values-defi11.yaml

global:
  securite: false

postgres:
  mode: statefulset
  persistance:
    enabled: true

postgres-replication:
  enabled: false

images:
  tags:
    front: v2
    back: v1
    qrGenerator: v1
    qrVerifier: v1

sondes:
  startup: {enabled: true}
  readiness: {enabled: true}
  liveness: {enabled: true}

hpa:
  enabled: true

networkPolicies:
  postgres:
    enabled: true
  applicatives:
    enabled: false

ingress:
  limites:
    enabled: false

hooks:
  configMap:
    enabled: false
  sauvegarde:
    enabled: false
  testFumee:
    enabled: false

sauvegardes:
  enabled: false
  planifiee: false
