<rect x="840" y="540" width="720" height="340" rx="12" fill="#100f0b" stroke="#8a8377" stroke-width="1.2"/>
<text x="76" y="564" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Node 2 (worker)</tspan><tspan fill="#a39c90" font-size="12" font-weight="400">   pods 10.42.1.0/24   kubelet, cni0</tspan></text>
<text x="856" y="564" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Node 3 (worker)</tspan><tspan fill="#a39c90" font-size="12" font-weight="400">   pods 10.42.2.0/24   kubelet, cni0</tspan></text>
<rect x="76" y="580" width="708" height="82" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="90" y="604" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">kube-proxy (règles iptables)</tspan></text>
<path d="M76,614 L784,614" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="90" y="635" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">10.43.171.20:80 : DNAT vers l'un des 3 pods, au hasard (clients du cluster)</tspan></text>
<rect x="856" y="580" width="688" height="82" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="870" y="604" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">kube-proxy (règles iptables)</tspan></text>
<path d="M856,614 L1544,614" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="870" y="635" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">même règle sur chaque nœud : le pod appelant n'a rien à choisir</tspan></text>
