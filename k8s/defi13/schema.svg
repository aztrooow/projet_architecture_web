<rect x="536" y="670" width="320" height="66" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="546" y="688" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">templates/secret.yaml</tspan></text>
<text x="546" y="706" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">Secret postgres-secrets</tspan></text>
<rect x="876" y="670" width="320" height="66" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="886" y="688" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">templates/configmap-init.yaml</tspan></text>
<text x="886" y="706" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">ConfigMap postgres-init</tspan></text>
<rect x="1216" y="670" width="294" height="66" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="1226" y="688" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">templates/services.yaml</tspan></text>
<text x="1226" y="706" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">les quatre Services</tspan></text>
<text x="536" y="780" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">Mêmes ressources, même topologie et même flux WAL qu'au défi 12 (voir son schéma).</tspan></text>
<path d="M654,312 L654,384" fill="none" stroke="#c0965e" stroke-width="3" marker-end="url(#m-or)"/>
<rect x="672.56" y="340" width="134.88" height="20" rx="5" fill="#0c0b09" stroke="#3a342a" stroke-width="0.8"/>
<text x="740" y="354.2" text-anchor="middle"><tspan fill="#d9b886" font-size="12" font-weight="400">nom DNS : postgres</tspan></text>
<rect x="40" y="860" width="760" height="120" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="54" y="884" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Ce que fait l'option postgres-replication.enabled</tspan></text>
<path d="M40,894 L800,894" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="54" y="915" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">false : templates/postgres.yaml rend le StatefulSet unique du défi 7</tspan></text>
<text x="54" y="934" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">true : la sous-charte rend primaire et réplique, le modèle unique disparaît</tspan></text>
<text x="54" y="953" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">dans les deux cas le back appelle le même nom : postgres</tspan></text>
<rect x="830" y="860" width="730" height="120" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="844" y="884" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Pourquoi une sous-charte</tspan></text>
<path d="M830,894 L1560,894" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="844" y="915" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">une unité réutilisable : ses modèles et ses valeurs sont à part</tspan></text>
<text x="844" y="934" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">activée par une option, sans toucher aux modèles du back</tspan></text>
<text x="844" y="953" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">le back (charte parent) ne sait pas quelle base se cache derrière</tspan></text>
<rect x="1476" y="849" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="1517.19" y="863.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
<path d="M40,1020 L74,1020" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<text x="84" y="1024" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">flux principal</tspan></text>
<path d="M195.04,1020 L229.04,1020" fill="none" stroke="#6f8fb0" stroke-width="2" marker-end="url(#m-bleu)"/>
<text x="239.04" y="1024" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">Service -&gt; pod (DNAT kube-proxy)</tspan></text>
