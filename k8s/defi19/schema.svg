<rect x="920" y="420" width="640" height="130" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="934" y="444" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Déploiement manuel (optionnel)</tspan></text>
