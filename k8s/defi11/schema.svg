<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" font-family="Verdana, 'DejaVu Sans', 'Segoe UI', Arial, sans-serif">
<title>Défi 11 : NetworkPolicy qui protège la base de données</title>
<defs>
<marker id="m-gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8377"/></marker>
<marker id="m-or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0965e"/></marker>
<marker id="m-rouge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c4584c"/></marker>
<marker id="m-vert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6fae78"/></marker>
</defs>
<rect width="1600" height="1100" rx="16" fill="#0c0b09"/>
<text x="50" y="46"><tspan fill="#c0965e" font-size="24" font-weight="600" letter-spacing="3">CINETINT</tspan><tspan dx="16" fill="#a39c90" font-size="15">défi 11 : NetworkPolicy cinetint-postgres-acces, seul le back joint postgres-0 sur 5432</tspan></text>
<text x="40" y="132" text-anchor="start"><tspan fill="#c0965e" font-size="14" font-weight="700">Clients de PostgreSQL (port 5432)</tspan></text>
<rect x="40" y="150" width="400" height="424" rx="14" fill="none" stroke="#8a8377" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="54" y="172" text-anchor="start"><tspan fill="#8a8377" font-size="12" font-weight="400">espace de noms u-XXX (le vôtre)</tspan></text>
<rect x="56" y="190" width="368" height="62" rx="8" fill="#16140f" stroke="#6fae78" stroke-width="2"/>
<text x="68" y="208" text-anchor="start"><tspan fill="#f3ebdd" font-size="12" font-weight="700">back-7c5b9-j8v3d</tspan></text>
<text x="68" y="225" text-anchor="start"><tspan fill="#d9b886" font-size="12" font-weight="400">10.42.2.23  (Node 3)</tspan></text>
<text x="68" y="242" text-anchor="start"><tspan fill="#6fae78" font-size="12" font-weight="400">component=back</tspan></text>
<rect x="56" y="262" width="368" height="62" rx="8" fill="#16140f" stroke="#6fae78" stroke-width="2"/>
<text x="68" y="280" text-anchor="start"><tspan fill="#f3ebdd" font-size="12" font-weight="700">back-7c5b9-q2l7s</tspan></text>
<text x="68" y="297" text-anchor="start"><tspan fill="#d9b886" font-size="12" font-weight="400">10.42.2.24  (Node 3)</tspan></text>
<text x="68" y="314" text-anchor="start"><tspan fill="#6fae78" font-size="12" font-weight="400">component=back</tspan></text>
<rect x="56" y="334" width="368" height="62" rx="8" fill="#16140f" stroke="#6fae78" stroke-width="2"/>
<text x="68" y="352" text-anchor="start"><tspan fill="#f3ebdd" font-size="12" font-weight="700">back-7c5b9-h4n6r</tspan></text>
<text x="68" y="369" text-anchor="start"><tspan fill="#d9b886" font-size="12" font-weight="400">10.42.1.21  (Node 2)</tspan></text>
<text x="68" y="386" text-anchor="start"><tspan fill="#6fae78" font-size="12" font-weight="400">component=back</tspan></text>
<rect x="56" y="424" width="368" height="62" rx="8" fill="#16140f" stroke="#c4584c" stroke-width="2"/>
<text x="68" y="442" text-anchor="start"><tspan fill="#f3ebdd" font-size="12" font-weight="700">front-6d8f7-x2k4p</tspan></text>
<text x="68" y="459" text-anchor="start"><tspan fill="#d9b886" font-size="12" font-weight="400">10.42.1.14  (Node 2)</tspan></text>
<text x="68" y="476" text-anchor="start"><tspan fill="#e08a7f" font-size="12" font-weight="400">component=front</tspan></text>
<rect x="56" y="496" width="368" height="62" rx="8" fill="#16140f" stroke="#c4584c" stroke-width="2"/>
<text x="68" y="514" text-anchor="start"><tspan fill="#f3ebdd" font-size="12" font-weight="700">test-psql</tspan></text>
<text x="68" y="531" text-anchor="start"><tspan fill="#d9b886" font-size="12" font-weight="400">10.42.2.40  (Node 3)</tspan></text>
<text x="68" y="548" text-anchor="start"><tspan fill="#e08a7f" font-size="12" font-weight="400">pod de test, sans component=back</tspan></text>
<rect x="40" y="598" width="400" height="120" rx="14" fill="none" stroke="#8a8377" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="54" y="620" text-anchor="start"><tspan fill="#8a8377" font-size="12" font-weight="400">espace de noms u-autre (une autre équipe)</tspan></text>
<rect x="56" y="632" width="368" height="62" rx="8" fill="#16140f" stroke="#c4584c" stroke-width="2"/>
<text x="68" y="650" text-anchor="start"><tspan fill="#f3ebdd" font-size="12" font-weight="700">back-7c5b9-z4n8c</tspan></text>
<text x="68" y="667" text-anchor="start"><tspan fill="#d9b886" font-size="12" font-weight="400">10.42.2.77  (Node 3)</tspan></text>
<text x="68" y="684" text-anchor="start"><tspan fill="#e08a7f" font-size="12" font-weight="400">component=back, mais autre espace</tspan></text>
<rect x="520" y="100" width="1050" height="660" rx="14" fill="#100f0b" stroke="#8a8377" stroke-width="1.2"/>
<text x="536" y="122" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Node 2 (worker)</tspan><tspan fill="#a39c90" font-size="12" font-weight="400">   pods 10.42.1.0/24</tspan></text>
<rect x="556" y="140" width="10" height="610" rx="4" fill="#d9b886" opacity="0.45"/>
<text x="536" y="778" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">pont cni0 (tunnel VXLAN vers Node 3)</tspan></text>
<rect x="600" y="140" width="280" height="610" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<rect x="800" y="129" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="841.188" y="143.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
<text x="614" y="162" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Filtre sur le veth</tspan></text>
<text x="614" y="180" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">règles iptables de Canal</tspan></text>
<rect x="610" y="192" width="260" height="226" rx="8" fill="#14201a" stroke="#6fae78" stroke-width="1.5"/>
<text x="624" y="216" text-anchor="start"><tspan fill="#6fae78" font-size="13" font-weight="700">AUTORISÉ</tspan></text>
<text x="624" y="240" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">pods de l'espace u-XXX</tspan></text>
<text x="624" y="260" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">avec l'étiquette component=back</tspan></text>
<text x="624" y="280" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">vers le port 5432/TCP</tspan></text>
<text x="624" y="300" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">(ingress.from + ports)</tspan></text>
<rect x="610" y="430" width="260" height="310" rx="8" fill="#231512" stroke="#c4584c" stroke-width="1.5"/>
<text x="624" y="454" text-anchor="start"><tspan fill="#e08a7f" font-size="13" font-weight="700">REFUSÉ</tspan></text>
<text x="624" y="478" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">tout le reste, jeté sans réponse :</tspan></text>
<text x="624" y="498" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">le front, un pod de test,</tspan></text>
<text x="624" y="518" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">tout pod d'un autre espace,</tspan></text>
<text x="624" y="538" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">tout autre port de postgres-0</tspan></text>
