<text x="450" y="799" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">requests 100m / 100Mi</tspan></text>
<text x="450" y="816" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">limits 200m / 200Mi</tspan></text>
<rect x="856" y="730" width="344" height="96" rx="8" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
