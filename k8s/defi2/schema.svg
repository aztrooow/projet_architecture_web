<text x="594" y="119" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">http://127.0.0.1:8001/api/v1/namespaces/u-XXX/services/csc8567/proxy/</tspan></text>
<path d="M580,97 L540,97" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
