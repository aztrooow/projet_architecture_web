<text x="654" y="427" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">10.43.171.20 :80  -&gt;  pods :5000</tspan></text>
<text x="654" y="446" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">DNS : csc8567.u-XXX.svc.cluster.local (CoreDNS)</tspan></text>
<text x="654" y="465" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">sélecteur app=csc8567 : trois endpoints</tspan></text>
