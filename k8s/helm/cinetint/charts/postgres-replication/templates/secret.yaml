{{- if and .Values.enabled .Values.creerSecret }}
# Utilisé seulement quand la sous-charte est installée seule : mots de passe générés une fois, puis conservés.
{{- $nom := include "pgr.secret" . }}
{{- $existant := lookup "v1" "Secret" .Release.Namespace $nom }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $nom }}
  labels:
    {{- include "pgr.labels" (dict "ctx" . "role" "secret") | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ if and $existant (hasKey ($existant.data | default dict) "POSTGRES_PASSWORD") }}{{ index $existant.data "POSTGRES_PASSWORD" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
  REPLICATION_PASSWORD: {{ if and $existant (hasKey ($existant.data | default dict) "REPLICATION_PASSWORD") }}{{ index $existant.data "REPLICATION_PASSWORD" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
{{- end }}
