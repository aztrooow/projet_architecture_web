<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="1600" height="1130" font-family="Verdana, 'DejaVu Sans', 'Segoe UI', Arial, sans-serif">
<title>Défi 16 : sauvegarde planifiée et restauration de la base</title>
<defs>
<marker id="m-bleu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f8fb0"/></marker>
<marker id="m-or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0965e"/></marker>
</defs>
<rect width="1600" height="1130" rx="16" fill="#0c0b09"/>
<text x="50" y="46"><tspan fill="#c0965e" font-size="24" font-weight="600" letter-spacing="3">CINETINT</tspan><tspan dx="16" fill="#a39c90" font-size="15">défi 16 : CronJob, Job, pg_dump vers un volume dédié, puis restauration</tspan></text>
<text x="40" y="84" text-anchor="start"><tspan fill="#c0965e" font-size="15" font-weight="700">1. Sauvegarde planifiée, chaque nuit</tspan></text>
<rect x="40" y="100" width="340" height="150" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="54" y="124" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">CronJob cinetint-sauvegarde</tspan></text>
<path d="M40,134 L380,134" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="54" y="155" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">schedule : 0 3 * * * (3 h chaque nuit)</tspan></text>
<text x="54" y="174" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">concurrencyPolicy : Forbid</tspan></text>
<text x="54" y="193" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">deux sauvegardes ne se chevauchent pas</tspan></text>
<rect x="296" y="89" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="337.188" y="103.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
<path d="M380,175 L430,175" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<text x="405" y="162" text-anchor="middle"><tspan fill="#d8d0c2" font-size="12" font-weight="400">crée</tspan></text>
<rect x="430" y="100" width="320" height="150" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="444" y="124" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Job de sauvegarde</tspan></text>
<path d="M430,134 L750,134" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="444" y="155" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">un Job par exécution</tspan></text>
<text x="444" y="174" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">un pod, restartPolicy Never</tspan></text>
<text x="444" y="193" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">backoffLimit 2, délai 900 s</tspan></text>
<rect x="666" y="89" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="707.188" y="103.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
<path d="M750,175 L800,175" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<text x="775" y="162" text-anchor="middle"><tspan fill="#d8d0c2" font-size="12" font-weight="400">lance</tspan></text>
<rect x="800" y="100" width="420" height="150" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="814" y="124" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Pod postgres:17-alpine</tspan></text>
<text x="1206" y="124" text-anchor="end"><tspan fill="#a39c90" font-size="12" font-weight="400">component=sauvegarde</tspan></text>
<path d="M800,134 L1220,134" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="814" y="155" text-anchor="start"><tspan fill="#c0965e" font-size="12" font-weight="700">1  </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">pg_dump -Fc par le Service postgres</tspan></text>
<text x="814" y="174" text-anchor="start"><tspan fill="#c0965e" font-size="12" font-weight="700">2  </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">pg_restore --list : fichier lisible ?</tspan></text>
<text x="814" y="193" text-anchor="start"><tspan fill="#c0965e" font-size="12" font-weight="700">3  </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">rétention : garde les 7 derniers</tspan></text>
<rect x="1136" y="89" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="1177.19" y="103.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
<path d="M1220,175 L1270,175" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<rect x="1270" y="100" width="290" height="150" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="1284" y="124" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">PVC cinetint-sauvegardes</tspan></text>
<path d="M1270,134 L1560,134" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="1284" y="155" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">200Mi, ReadWriteOnce</tspan></text>
<text x="1284" y="174" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">distinct de data-postgres-0</tspan></text>
<text x="1284" y="193" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">survit à helm uninstall</tspan></text>
<rect x="1476" y="89" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="1517.19" y="103.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
<rect x="800" y="330" width="420" height="46" rx="9" fill="#12161a" stroke="#6f8fb0" stroke-width="1.5"/>
<text x="810" y="349" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">Service </tspan><tspan fill="#f3ebdd" font-size="13" font-weight="700">postgres</tspan></text>
<text x="810" y="366" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">10.43.230.74 :5432  (lecture pour pg_dump)</tspan></text>
<path d="M1010,250 L1010,330" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<text x="1026" y="296" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">lecture en base</tspan></text>
<rect x="800" y="410" width="420" height="100" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="814" y="434" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Pod postgres-0 (StatefulSet)</tspan></text>
<path d="M800,444 L1220,444" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="814" y="465" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">NetworkPolicy : component=sauvegarde</tspan></text>
<text x="814" y="484" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">est autorisé à joindre :5432</tspan></text>
<path d="M1010,376 L1010,410" fill="none" stroke="#6f8fb0" stroke-width="2" marker-end="url(#m-bleu)"/>
<circle cx="1190" cy="394" r="9" fill="#0c0b09" stroke="#6fae78" stroke-width="2"/>
<path d="M1185,394 L1189,398 L1196,389" stroke="#6fae78" stroke-width="3" fill="none"/>
<rect x="1270" y="410" width="290" height="100" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="1280" y="428" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">PVC data-postgres-0</tspan></text>
<text x="1280" y="446" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">100Mi, volume de la base</tspan></text>
<text x="1280" y="463" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">séparé des sauvegardes</tspan></text>
<rect x="40" y="330" width="720" height="180" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="54" y="354" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Pourquoi un volume séparé</tspan></text>
<path d="M40,364 L760,364" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="54" y="385" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">si le volume de la base est perdu, les sauvegardes survivent</tspan></text>
<text x="54" y="404" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">pg_restore --list vérifie le fichier avant de le garder</tspan></text>
<text x="54" y="423" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">rétention 7 : les plus anciens fichiers sont supprimés</tspan></text>
<text x="54" y="442" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">la sauvegarde manuelle du défi 15 écrit dans le même volume</tspan></text>
<text x="40" y="596" text-anchor="start"><tspan fill="#c0965e" font-size="15" font-weight="700">2. Restauration, à la main, après avoir arrêté le back</tspan></text>
<rect x="40" y="616" width="340" height="130" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="2"/>
<circle cx="64" cy="642" r="12" fill="#c0965e"/>
<text x="64" y="646.2" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">1</text>
<text x="86" y="647" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">back à 0 réplique</tspan></text>
<text x="56" y="678" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">kubectl scale deployment back</tspan></text>
<text x="56" y="697" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">--replicas=0</tspan></text>
<text x="56" y="716" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">plus aucune écriture</tspan></text>
<path d="M380,681 L430,681" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<rect x="430" y="616" width="340" height="130" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="2"/>
<circle cx="454" cy="642" r="12" fill="#c0965e"/>
<text x="454" y="646.2" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">2</text>
<text x="476" y="647" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Job de restauration</tspan></text>
<text x="446" y="678" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">component=sauvegarde : autorisé</tspan></text>
<text x="446" y="697" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">monte cinetint-sauvegardes</tspan></text>
<text x="446" y="716" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">FICHIER vide : le plus récent</tspan></text>
<path d="M770,681 L820,681" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<rect x="820" y="616" width="340" height="130" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="2"/>
<circle cx="844" cy="642" r="12" fill="#c0965e"/>
<text x="844" y="646.2" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">3</text>
<text x="866" y="647" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">pg_restore</tspan></text>
<text x="836" y="678" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">--clean --if-exists</tspan></text>
<text x="836" y="697" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">une seule transaction : si elle</tspan></text>
<text x="836" y="716" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">échoue, la base reste intacte</tspan></text>
<path d="M1160,681 L1210,681" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<rect x="1210" y="616" width="340" height="130" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="2"/>
<circle cx="1234" cy="642" r="12" fill="#c0965e"/>
<text x="1234" y="646.2" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">4</text>
<text x="1256" y="647" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">back remis à 3</tspan></text>
<text x="1226" y="678" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">kubectl scale deployment back</tspan></text>
<text x="1226" y="697" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">--replicas=3</tspan></text>
<text x="1226" y="716" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">le service reprend</tspan></text>
<text x="40" y="790" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Chemin des données pendant la restauration</tspan></text>
<rect x="40" y="806" width="340" height="90" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="1.5"/>
<text x="54" y="830" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">PVC cinetint-sauvegardes</tspan></text>
<path d="M40,840 L380,840" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="54" y="861" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">fichier .dump le plus récent</tspan></text>
<path d="M380,851 L430,851" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<rect x="430" y="806" width="340" height="90" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="1.5"/>
<text x="444" y="830" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">Pod du Job de restauration</tspan></text>
<path d="M430,840 L770,840" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="444" y="861" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">postgres:17-alpine, pg_restore</tspan></text>
<path d="M770,851 L820,851" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<rect x="820" y="806" width="340" height="90" rx="10" fill="#16140f" stroke="#6f8fb0" stroke-width="1.5"/>
<text x="834" y="830" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">Service postgres</tspan></text>
<path d="M820,840 L1160,840" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="834" y="861" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">10.43.230.74 :5432</tspan></text>
<path d="M1160,851 L1210,851" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<rect x="1210" y="806" width="340" height="90" rx="10" fill="#16140f" stroke="#8a8377" stroke-width="1.5"/>
<text x="1224" y="830" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">Pod postgres-0</tspan></text>
<path d="M1210,840 L1550,840" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="1224" y="861" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">données remplacées, PVC conservé</tspan></text>
<rect x="40" y="930" width="760" height="56" rx="10" fill="#16140f" stroke="#8a8377" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
<text x="54" y="954" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">back : 0 pod pendant la restauration</tspan></text>
<text x="54" y="974" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">les Services front, qr-* et l'Ingress restent en place</tspan></text>
<rect x="830" y="930" width="730" height="56" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="844" y="952" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">FICHIER vide : la sauvegarde la plus récente ; sinon le nom du fichier .dump</tspan></text>
<path d="M40,1030 L74,1030" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<text x="84" y="1034" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">flux de la sauvegarde ou de la restauration</tspan></text>
<path d="M377.44,1030 L411.44,1030" fill="none" stroke="#6f8fb0" stroke-width="2" marker-end="url(#m-bleu)"/>
<text x="421.44" y="1034" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">Service -&gt; pod</tspan></text>
<rect x="546.52" y="1022" width="34" height="16" rx="4" fill="#16140f" stroke="#8a8377" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>
<text x="590.52" y="1034" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">pod arrêté</tspan></text>
<rect x="688" y="1022" width="34" height="16" rx="4" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="732" y="1034" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">NOUVEAU dans ce défi</tspan></text>
</svg>
