# Défi 6 : la charte reproduit l'infrastructure du Défi 5 (base dans un Deployment, sans volume), avec une ConfigMap pour la connexion à la base.
# Valeurs cumulatives : ce fichier contient l'état complet voulu à la fin du défi.
# Utilisation : helm upgrade --install cinetint ../helm/cinetint -n u-XXX -f ../helm/cinetint/values-cours.yaml -f values-defi6.yaml

global:
  securite: false

postgres:
  mode: deployment
  persistance:
    enabled: false

postgres-replication:
  enabled: false

images:
  tags:
    front: v1
    back: v1
    qrGenerator: v1
    qrVerifier: v1

sondes:
  startup: {enabled: false}
  readiness: {enabled: false}
  liveness: {enabled: false}

hpa:
  enabled: false

networkPolicies:
  postgres:
    enabled: false
  applicatives:
    enabled: false

ingress:
  limites:
    enabled: false

hooks:
  configMap:
    enabled: false
  sauvegarde:
    enabled: false
  testFumee:
    enabled: false

sauvegardes:
  enabled: false
  planifiee: false
