<text x="820" y="600.2" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">4</text>
<rect x="60" y="900" width="740" height="170" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="74" y="924" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Accès par kubectl proxy</tspan></text>
<path d="M60,934 L800,934" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="74" y="955" text-anchor="start"><tspan fill="#c0965e" font-size="12" font-weight="700">1  </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">curl parle HTTP à kubectl proxy (127.0.0.1:8001)</tspan></text>
<text x="74" y="974" text-anchor="start"><tspan fill="#c0965e" font-size="12" font-weight="700">2  </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">kubectl proxy transmet à l'API server (:6443, Node 1)</tspan></text>
<text x="74" y="993" text-anchor="start"><tspan fill="#c0965e" font-size="12" font-weight="700">3  </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">l'API server lit le Service csc8567 : nom DNS, port 80, sélecteur</tspan></text>
<text x="74" y="1012" text-anchor="start"><tspan fill="#c0965e" font-size="12" font-weight="700">4  </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">il choisit l'un des trois endpoints et appelle le pod (port 5000)</tspan></text>
<rect x="830" y="900" width="730" height="170" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="844" y="924" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Ce que ce défi ajoute au défi 1</tspan></text>
<path d="M830,934 L1560,934" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="844" y="955" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">trois pods au lieu d'un, répartis sur les deux workers</tspan></text>
<text x="844" y="974" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">chaque pod borné : requests 100m / 100Mi, limits 200m / 200Mi</tspan></text>
<text x="844" y="993" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">un Service ClusterIP : une IP virtuelle stable et un nom DNS</tspan></text>
<text x="844" y="1012" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">le Deployment recrée un pod supprimé (autoguérison)</tspan></text>
<rect x="1476" y="889" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="1517.19" y="903.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
