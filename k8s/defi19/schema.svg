<text x="934" y="513" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">helm upgrade --install sur le cluster du cours</tspan></text>
<rect x="1476" y="409" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="1517.19" y="423.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
