{{- if .Values.hpa.enabled }}
# Défi 9 : un HorizontalPodAutoscaler par Deployment (front et back). Il compare l'utilisation
# moyenne de CPU des pods à leur demande (requests.cpu = 100m) et ajoute ou retire des pods.
# Il lit les mesures de metrics-server. Avec une cible de 60 %, au-delà de 60m de CPU en moyenne
# par pod, les pods sont multipliés, dans la limite de hpa.max (10).
{{- range .Values.hpa.composants }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "cinetint.nom" (dict "ctx" $ "n" .) }}
  labels:
    {{- include "cinetint.labels" (dict "ctx" $ "c" .) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "cinetint.nom" (dict "ctx" $ "n" .) }}
  minReplicas: {{ $.Values.hpa.min }}
  maxReplicas: {{ $.Values.hpa.max }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.hpa.cpuMoyen }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ $.Values.hpa.stabilisationReduction }}
{{- end }}
{{- end }}
