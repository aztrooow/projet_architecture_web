<text x="1564" y="168" text-anchor="end"><tspan fill="#8a8377" font-size="12" font-weight="400">Cluster Kubernetes RKE2, espace de noms u-XXX</tspan></text>
<rect x="60" y="182" width="1500" height="150" rx="12" fill="#100f0b" stroke="#8a8377" stroke-width="1.2"/>
<text x="76" y="206" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Node 1 (master, control plane)</tspan><tspan fill="#a39c90" font-size="12" font-weight="400">   aucun pod applicatif ici</tspan></text>
<rect x="76" y="222" width="330" height="98" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="1.5"/>
<text x="90" y="246" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">API server :6443</tspan></text>
<path d="M76,256 L406,256" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="90" y="277" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">reçoit l'URL de kubectl proxy</tspan></text>
<text x="90" y="296" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">lit le Service et ses endpoints</tspan></text>
<text x="90" y="315" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">relaie vers un des pods</tspan></text>
<rect x="420" y="222" width="190" height="98" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="430" y="240" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">etcd</tspan></text>
<text x="430" y="258" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">Deployment,</tspan></text>
<text x="430" y="275" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">Service, endpoints</tspan></text>
<rect x="624" y="222" width="190" height="98" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="634" y="240" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">scheduler</tspan></text>
<text x="634" y="258" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">répartit les 3 pods</tspan></text>
<text x="634" y="275" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">sur Node 2 et Node 3</tspan></text>
<rect x="828" y="222" width="230" height="98" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="838" y="240" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">controller-manager</tspan></text>
<text x="838" y="258" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">Deployment -&gt; ReplicaSet</tspan></text>
<text x="838" y="275" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">ReplicaSet -&gt; pods</tspan></text>
<rect x="1072" y="222" width="474" height="98" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="1086" y="246" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Deployment csc8567</tspan></text>
