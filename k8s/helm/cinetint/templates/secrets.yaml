# Mots de passe, jetons et clé de signature des billets.
# Les valeurs absentes de values.yaml sont générées une seule fois puis conservées (lookup).
{{- $nom := include "cinetint.nomApp" (dict "ctx" . "n" "secrets") }}
{{- $existant := lookup "v1" "Secret" .Release.Namespace $nom }}
{{- $nomCle := include "cinetint.nomApp" (dict "ctx" . "n" "cle") }}
{{- $existantCle := lookup "v1" "Secret" .Release.Namespace $nomCle }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $nom }}
  labels:
    {{- include "cinetint.labels" (dict "ctx" . "c" "secrets") | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ include "cinetint.valeurSecret" (dict "existant" $existant "cle" "POSTGRES_PASSWORD" "valeur" .Values.postgres.motDePasse "longueur" 24) }}
  REPLICATION_PASSWORD: {{ include "cinetint.valeurSecret" (dict "existant" $existant "cle" "REPLICATION_PASSWORD" "valeur" "" "longueur" 24) }}
  SERVICE_TOKEN: {{ include "cinetint.valeurSecret" (dict "existant" $existant "cle" "SERVICE_TOKEN" "valeur" .Values.secrets.serviceToken "longueur" 32) }}
  JWT_SECRET: {{ include "cinetint.valeurSecret" (dict "existant" $existant "cle" "JWT_SECRET" "valeur" .Values.secrets.jwtSecret "longueur" 48) }}
  GERANT_MOT_DE_PASSE: {{ include "cinetint.valeurSecret" (dict "existant" $existant "cle" "GERANT_MOT_DE_PASSE" "valeur" .Values.secrets.gerantMotDePasse "longueur" 16) }}
  CONTROLEUR_MOT_DE_PASSE: {{ include "cinetint.valeurSecret" (dict "existant" $existant "cle" "CONTROLEUR_MOT_DE_PASSE" "valeur" .Values.secrets.controleurMotDePasse "longueur" 16) }}
---
# Clé privée Ed25519 : commune à TOUTES les répliques du qr-generator.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $nomCle }}
  labels:
    {{- include "cinetint.labels" (dict "ctx" . "c" "qr-generator") | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.cleSignature }}
  cle-ed25519.pem: {{ .Values.secrets.cleSignature | b64enc }}
  {{- else if and $existantCle (hasKey ($existantCle.data | default dict) "cle-ed25519.pem") }}
  cle-ed25519.pem: {{ index $existantCle.data "cle-ed25519.pem" }}
  {{- else }}
  cle-ed25519.pem: {{ genPrivateKey "ed25519" | b64enc }}
  {{- end }}
