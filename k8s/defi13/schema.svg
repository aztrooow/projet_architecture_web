<rect x="990.54" y="556" width="64.92" height="20" rx="5" fill="#0c0b09" stroke="#3a342a" stroke-width="0.8"/>
<text x="1023" y="570.2" text-anchor="middle"><tspan fill="#d9b886" font-size="12" font-weight="400">flux WAL</tspan></text>
