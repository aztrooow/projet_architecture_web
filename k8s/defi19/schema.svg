<text x="934" y="174" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">1 control-plane + 2 workers</tspan></text>
<text x="934" y="193" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">Calico, ingress-nginx, metrics-server</tspan></text>
<text x="934" y="212" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">chargement des images</tspan></text>
<text x="934" y="231" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">helm lint, helm install, helm test</tspan></text>
<text x="934" y="250" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">test de fumée : parcours complet</tspan></text>
<text x="934" y="269" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">par l'Ingress</tspan></text>
<text x="934" y="288" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">essai de mise à jour progressive</tspan></text>
<rect x="1330" y="100" width="230" height="250" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="1.5"/>
<text x="1344" y="124" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Job publication</tspan></text>
<path d="M1330,134 L1560,134" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="1344" y="155" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">docker push</tspan></text>
<text x="1344" y="174" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">vers ghcr.io</tspan></text>
<text x="1344" y="193" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">les 4 images</tspan></text>
<text x="1344" y="231" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">if : branche main</tspan></text>
<text x="1344" y="250" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">needs : kind</tspan></text>
<text x="1344" y="269" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">tout doit être vert</tspan></text>
