<text x="1086" y="277" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">replicas 3, image xhelozs/csc8567:v1</tspan></text>
<text x="1086" y="296" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">requests 100m / 100Mi, limits 200m / 200Mi</tspan></text>
<text x="1086" y="315" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">ReplicaSet csc8567-6c9d5 : garde 3 pods</tspan></text>
