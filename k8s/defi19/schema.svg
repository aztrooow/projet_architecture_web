<path d="M920,624 L1560,624" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="934" y="645" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">images tirées de ghcr.io</tspan></text>
<text x="934" y="664" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">la charte cinetint est installée comme au défi 6</tspan></text>
<rect x="40" y="400" width="840" height="180" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="54" y="424" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Portes de qualité (losanges or)</tspan></text>
<path d="M40,434 L880,434" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="54" y="455" text-anchor="start"><tspan fill="#c0965e" font-size="12" font-weight="700">1  </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">tests : les 4 services passent leurs tests avec une vraie base et un vrai Redis</tspan></text>
<text x="54" y="474" text-anchor="start"><tspan fill="#c0965e" font-size="12" font-weight="700">2  </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">images : les 4 images se construisent, aucun Dockerfile cassé</tspan></text>
<text x="54" y="493" text-anchor="start"><tspan fill="#c0965e" font-size="12" font-weight="700">3  </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">kind : la charte s'installe, tous les pods sont Ready, helm test passe,</tspan></text>
<text x="54" y="512" text-anchor="start"><tspan fill="#c0965e" font-size="12" font-weight="700">    </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">le parcours complet par l'Ingress marche, la mise à jour ne coupe rien</tspan></text>
<text x="54" y="531" text-anchor="start"><tspan fill="#c0965e" font-size="12" font-weight="700">4  </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">publication : seulement sur main, et seulement si 1, 2 et 3 sont verts</tspan></text>
<rect x="796" y="389" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="837.188" y="403.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
<rect x="40" y="600" width="840" height="90" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="54" y="624" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Pourquoi un cluster kind dans la CI</tspan></text>
<path d="M40,634 L880,634" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="54" y="655" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">la charte Helm est essayée sur un vrai Kubernetes (Calico, Ingress, metrics-server)</tspan></text>
<text x="54" y="674" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">avant d'arriver sur le cluster du cours</tspan></text>
<path d="M40,740 L74,740" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<text x="84" y="744" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">enchaînement (needs)</tspan></text>
<rect x="257.68" y="732" width="34" height="16" rx="4" fill="#16140f" stroke="#c0965e" stroke-width="1.5"/>
<text x="301.68" y="744" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">job qui garde une porte</tspan></text>
<rect x="478.12" y="732" width="34" height="16" rx="4" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="522.12" y="744" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">NOUVEAU dans ce défi</tspan></text>
<text x="40" y="790" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">Si une porte échoue, tout ce qui suit est arrêté : rien n'est publié et rien n'est déployé tant que les tests, les images et le cluster kind ne sont pas verts.</tspan></text>
</svg>
