<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" width="1600" height="1060" font-family="Verdana, 'DejaVu Sans', 'Segoe UI', Arial, sans-serif">
<title>Défi 13 : la réplication PostgreSQL dans une sous-charte Helm</title>
<defs>
<marker id="m-bleu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f8fb0"/></marker>
<marker id="m-gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8377"/></marker>
<marker id="m-or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0965e"/></marker>
</defs>
<rect width="1600" height="1060" rx="16" fill="#0c0b09"/>
<text x="50" y="46"><tspan fill="#c0965e" font-size="24" font-weight="600" letter-spacing="3">CINETINT</tspan><tspan dx="16" fill="#a39c90" font-size="15">défi 13 : charte cinetint, sous-charte postgres-replication, activée par une option</tspan></text>
<rect x="40" y="70" width="420" height="90" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="54" y="94" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Poste du développeur</tspan></text>
<path d="M40,104 L460,104" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="54" y="125" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">helm upgrade --install cinetint</tspan></text>
<text x="54" y="144" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">-f values-cours.yaml -f values-defi13.yaml</tspan></text>
<rect x="40" y="196" width="420" height="150" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="54" y="220" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">values-defi13.yaml</tspan></text>
<path d="M40,230 L460,230" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="54" y="251" text-anchor="start"><tspan fill="#d9b886" font-size="12" font-weight="700">postgres-replication:</tspan></text>
<text x="54" y="270" text-anchor="start"><tspan fill="#6fae78" font-size="12" font-weight="400">  enabled: true</tspan></text>
<text x="54" y="289" text-anchor="start"><tspan fill="#d9b886" font-size="12" font-weight="700">postgres:</tspan></text>
<text x="54" y="308" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">  mode: statefulset</tspan></text>
<rect x="376" y="185" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="417.188" y="199.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
<path d="M250,160 L250,196" fill="none" stroke="#8a8377" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m-gris)"/>
<rect x="40" y="396" width="420" height="112" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="54" y="420" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Rendu par helm (sur le poste)</tspan></text>
<path d="M40,430 L460,430" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="54" y="451" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">assemble la charte et sa sous-charte</tspan></text>
<text x="54" y="470" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">remplace les valeurs dans les modèles</tspan></text>
<text x="54" y="489" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">évalue condition: postgres-replication.enabled</tspan></text>
<path d="M250,346 L250,396" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<rect x="40" y="560" width="420" height="100" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="54" y="584" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">API server (Node 1)</tspan></text>
<path d="M40,594 L460,594" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="54" y="615" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">reçoit les manifests rendus</tspan></text>
<text x="54" y="634" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">crée les objets dans l'espace u-XXX</tspan></text>
<path d="M250,508 L250,560" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<path d="M460,610 L500,610" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<rect x="500" y="70" width="1060" height="760" rx="14" fill="none" stroke="#c0965e" stroke-width="1.5"/>
<text x="520" y="94" text-anchor="start"><tspan fill="#c0965e" font-size="14" font-weight="700">charte cinetint (charte globale)</tspan></text>
<rect x="520" y="110" width="1020" height="92" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="534" y="134" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Chart.yaml de la charte globale</tspan></text>
<path d="M520,144 L1540,144" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="534" y="165" text-anchor="start"><tspan fill="#d9b886" font-size="12" font-weight="700">dependencies : </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">postgres-replication 0.1.0</tspan></text>
<text x="534" y="184" text-anchor="start"><tspan fill="#d9b886" font-size="12" font-weight="700">condition : </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">postgres-replication.enabled</tspan></text>
<rect x="520" y="222" width="320" height="90" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="530" y="240" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">templates/back.yaml</tspan></text>
<text x="530" y="258" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">Deployment back x3 (charte parent)</tspan></text>
<text x="530" y="275" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">appelle le nom postgres:5432</tspan></text>
<rect x="860" y="222" width="320" height="90" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="870" y="240" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">templates/front, qr-*, redis</tspan></text>
<text x="870" y="258" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">Deployments et Services</tspan></text>
<text x="870" y="275" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">de la charte parent</tspan></text>
<rect x="1200" y="222" width="340" height="90" rx="8" fill="#1d1a13" stroke="#8a8377" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.6"/>
<text x="1210" y="240" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">templates/postgres.yaml</tspan></text>
<text x="1210" y="276" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">StatefulSet unique (défi 7)</tspan></text>
<text x="1210" y="293" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">non rendu : la condition est vraie</tspan></text>
<rect x="520" y="340" width="1020" height="480" rx="12" fill="none" stroke="#c0965e" stroke-width="3"/>
<rect x="1420" y="329" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="1461.19" y="343.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
<text x="1520" y="364" text-anchor="end"><tspan fill="#d9b886" font-size="13" font-weight="700">sous-charte postgres-replication (charts/postgres-replication)</tspan></text>
<rect x="536" y="384" width="236" height="46" rx="9" fill="#12161a" stroke="#6f8fb0" stroke-width="1.5"/>
<text x="546" y="403" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">Service </tspan><tspan fill="#f3ebdd" font-size="13" font-weight="700">postgres</tspan></text>
<text x="546" y="420" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">10.43.230.74 :5432  rw</tspan></text>
<rect x="782" y="384" width="236" height="46" rx="9" fill="#12161a" stroke="#6f8fb0" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="792" y="403" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">headless </tspan><tspan fill="#f3ebdd" font-size="13" font-weight="700">postgres-primaire</tspan></text>
<text x="792" y="420" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">DNS par pod</tspan></text>
<rect x="1028" y="384" width="236" height="46" rx="9" fill="#12161a" stroke="#6f8fb0" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="1038" y="403" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">headless </tspan><tspan fill="#f3ebdd" font-size="13" font-weight="700">postgres-replique</tspan></text>
<text x="1038" y="420" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">DNS par pod</tspan></text>
<rect x="1274" y="384" width="236" height="46" rx="9" fill="#12161a" stroke="#6f8fb0" stroke-width="1.5"/>
<text x="1284" y="403" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">Service </tspan><tspan fill="#f3ebdd" font-size="13" font-weight="700">postgres-lecture</tspan></text>
<text x="1284" y="420" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">10.43.99.17 :5432  ro</tspan></text>
<rect x="536" y="476" width="440" height="170" rx="10" fill="#16140f" stroke="#8a8377" stroke-width="1.5"/>
<text x="550" y="500" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">StatefulSet postgres-primaire</tspan></text>
<text x="550" y="524" text-anchor="start"><tspan fill="#d9b886" font-size="12" font-weight="400">templates/primaire.yaml</tspan></text>
<text x="550" y="543" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">pod postgres-primaire-0 : 10.42.1.8</tspan></text>
<text x="550" y="562" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">PVC data-postgres-primaire-0 (100Mi)</tspan></text>
<text x="550" y="581" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">walsender, lecture et écriture</tspan></text>
<rect x="1070" y="476" width="440" height="170" rx="10" fill="#16140f" stroke="#8a8377" stroke-width="1.5"/>
<text x="1084" y="500" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">StatefulSet postgres-replique</tspan></text>
<text x="1084" y="524" text-anchor="start"><tspan fill="#d9b886" font-size="12" font-weight="400">templates/replique.yaml</tspan></text>
<text x="1084" y="543" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">initContainer : pg_basebackup -R</tspan></text>
<text x="1084" y="562" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">pod postgres-replique-0 : 10.42.2.9</tspan></text>
<text x="1084" y="581" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">PVC data-postgres-replique-0 (100Mi)</tspan></text>
<text x="1084" y="600" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">walreceiver, lecture seule</tspan></text>
