<text x="531.6" y="1024" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">Service ClusterIP</tspan></text>
<rect x="675.52" y="1012" width="34" height="16" rx="4" fill="#16140f" stroke="#8a8377" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>
<text x="719.52" y="1024" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">modèle non rendu</tspan></text>
<rect x="863.56" y="1012" width="34" height="16" rx="4" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="907.56" y="1024" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">NOUVEAU dans ce défi</tspan></text>
