{{- if .Values.enabled }}
# Script exécuté UNE fois par l'image PostgreSQL, à la première création du primaire
# (dossier /docker-entrypoint-initdb.d) : compte de réplication et autorisation dans pg_hba.conf.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pgr.nom" (dict "ctx" . "n" "postgres-replication-init") }}
  labels:
    {{- include "pgr.labels" (dict "ctx" . "role" "primaire") | nindent 4 }}
data:
  10-replication.sh: |
    #!/bin/sh
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres <<-EOSQL
      CREATE ROLE ${REPLICATION_USER} WITH REPLICATION LOGIN PASSWORD '${REPLICATION_PASSWORD}';
    EOSQL
    # le mot-clé « replication » n'est pas couvert par « all » : il faut une ligne dédiée
    echo "host replication ${REPLICATION_USER} all scram-sha-256" >> "$PGDATA/pg_hba.conf"
    echo "[primaire] compte de réplication ${REPLICATION_USER} créé"
{{- end }}
