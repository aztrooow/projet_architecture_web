<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 870" width="1600" height="870" font-family="Verdana, 'DejaVu Sans', 'Segoe UI', Arial, sans-serif">
<title>Défi 19 : intégration continue avec GitHub Actions</title>
<defs>
<marker id="m-or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0965e"/></marker>
</defs>
<rect width="1600" height="870" rx="16" fill="#0c0b09"/>
<text x="50" y="46"><tspan fill="#c0965e" font-size="24" font-weight="600" letter-spacing="3">CINETINT</tspan><tspan dx="16" fill="#a39c90" font-size="15">défi 19 : tests, images, cluster kind éphémère, publication et déploiement manuel</tspan></text>
<rect x="40" y="100" width="190" height="250" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="54" y="124" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Déclencheurs</tspan></text>
<path d="M40,134 L230,134" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="54" y="155" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">push</tspan></text>
<text x="54" y="174" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">pull_request</tspan></text>
<text x="54" y="193" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">workflow_dispatch</tspan></text>
<text x="54" y="231" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">fichier :</tspan></text>
<text x="54" y="250" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">.github/workflows/</tspan></text>
<text x="54" y="269" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">ci.yml</tspan></text>
<rect x="270" y="100" width="300" height="250" rx="10" fill="#16140f" stroke="#8a8377" stroke-width="1.5"/>
<text x="284" y="124" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Job tests</tspan></text>
<text x="556" y="124" text-anchor="end"><tspan fill="#a39c90" font-size="12" font-weight="400">ubuntu</tspan></text>
<path d="M270,134 L570,134" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="284" y="155" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">back : pytest</tspan></text>
<text x="284" y="174" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">qr-generator : pytest</tspan></text>
<text x="284" y="193" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">qr-verifier : pytest</tspan></text>
<text x="284" y="212" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">front : tests</tspan></text>
<text x="284" y="250" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">services du job :</tspan></text>
<text x="284" y="269" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">PostgreSQL 17 et Redis 8</tspan></text>
<rect x="610" y="100" width="270" height="250" rx="10" fill="#16140f" stroke="#8a8377" stroke-width="1.5"/>
<text x="624" y="124" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Job images</tspan></text>
<path d="M610,134 L880,134" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="624" y="155" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">build des 4 images :</tspan></text>
<text x="624" y="174" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">front, back,</tspan></text>
<text x="624" y="193" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">qr-generator, qr-verifier</tspan></text>
<text x="624" y="212" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">cache de couches</tspan></text>
<text x="624" y="231" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">(GitHub Actions)</tspan></text>
<text x="624" y="250" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">tag : SHA du commit</tspan></text>
<text x="624" y="269" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">needs : tests</tspan></text>
<rect x="920" y="100" width="370" height="250" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="1.5"/>
<text x="934" y="124" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Job kind</tspan></text>
