# Proxy d'entrée de CinetINT : seul conteneur joignable depuis l'hôte (port 80 du conteneur).
# Il répartit le trafic selon le préfixe de l'URL, comme le fera l'Ingress Kubernetes
# et comme le fait déjà le nginx de la version en ligne.
#
#   /               front          pages rendues côté serveur et application React (dont /admin)
#   /api/           back           API REST et flux SSE (tampon désactivé)
#   /qr/            qr-generator   images des QR codes, clé publique
#   /verification   qr-verifier    contrôle des billets
#   /internal/      404            routes entre services, jamais exposées

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DNS interne de Docker (127.0.0.11) : le nom d'un service se résout en son adresse
    # sur le réseau « front ». Résolu à chaque requête (valid=5s), nginx suit un conteneur
    # recréé sans redémarrage et démarre même si un service n'est pas encore prêt.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # en-têtes transmis aux services
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";

    server {
        listen 80;
        server_name _;

        # sonde du proxy lui-même (healthcheck Docker)
        location = /nginx-sante {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # routes entre services : jamais exposées
        location ^~ /internal/ {
            return 404;
        }

        # API et flux SSE : une réponse SSE ne finit jamais, donc ni tampon ni délai de lecture court
        location /api/ {
            set $service_back http://back:8000;
            proxy_pass $service_back;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location /qr/ {
            set $service_qr_generator http://qr-generator:8001;
            proxy_pass $service_qr_generator;
        }

        location = /verification {
            set $service_qr_verifier http://qr-verifier:8002;
            proxy_pass $service_qr_verifier;
        }

        location /verification/ {
            set $service_qr_verifier http://qr-verifier:8002;
            proxy_pass $service_qr_verifier;
        }

        # tout le reste : le front
        location / {
            set $service_front http://front:8080;
            proxy_pass $service_front;
        }
    }
}
