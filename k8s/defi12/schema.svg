<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1190" width="1600" height="1190" font-family="Verdana, 'DejaVu Sans', 'Segoe UI', Arial, sans-serif">
<title>Défi 12 : réplication PostgreSQL en flux entre un primaire et une réplique</title>
<defs>
<marker id="m-bleu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f8fb0"/></marker>
<marker id="m-gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8377"/></marker>
<marker id="m-or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0965e"/></marker>
</defs>
<rect width="1600" height="1190" rx="16" fill="#0c0b09"/>
<text x="50" y="46"><tspan fill="#c0965e" font-size="24" font-weight="600" letter-spacing="3">CINETINT</tspan><tspan dx="16" fill="#a39c90" font-size="15">défi 12 : réplication en flux (WAL), primaire en lecture-écriture, réplique en lecture seule</tspan></text>
<rect x="20" y="62" width="1560" height="1100" rx="14" fill="none" stroke="#8a8377" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="1564" y="82" text-anchor="end"><tspan fill="#8a8377" font-size="12" font-weight="400">Cluster Kubernetes RKE2 : espace de noms u-XXX</tspan></text>
<rect x="130" y="96" width="480" height="74" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="144" y="120" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Pods back (x3)</tspan></text>
<path d="M130,130 L610,130" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="144" y="151" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">écrivent sur le nom postgres : INSERT, UPDATE</tspan></text>
<rect x="990" y="96" width="480" height="74" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="1004" y="120" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Client psql (pod ou poste)</tspan></text>
<path d="M990,130 L1470,130" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="1004" y="151" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">lit sur le nom postgres-lecture : SELECT</tspan></text>
<rect x="190" y="216" width="360" height="46" rx="9" fill="#12161a" stroke="#6f8fb0" stroke-width="1.5"/>
<text x="200" y="235" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">Service </tspan><tspan fill="#f3ebdd" font-size="13" font-weight="700">postgres</tspan></text>
<text x="200" y="252" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">10.43.230.74 :5432   écriture (rw)</tspan></text>
<rect x="1050" y="216" width="360" height="46" rx="9" fill="#12161a" stroke="#c0965e" stroke-width="3"/>
<text x="1060" y="235" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">Service </tspan><tspan fill="#f3ebdd" font-size="13" font-weight="700">postgres-lecture</tspan></text>
<text x="1060" y="252" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">10.43.99.17 :5432   lecture (ro)</tspan></text>
<rect x="1328" y="253" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="1369.19" y="267.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
<path d="M300,170 L300,216" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<rect x="270.66" y="183" width="58.68" height="20" rx="5" fill="#0c0b09" stroke="#3a342a" stroke-width="0.8"/>
<text x="300" y="197.2" text-anchor="middle"><tspan fill="#d9b886" font-size="12" font-weight="400">écriture</tspan></text>
<path d="M1230,170 L1230,216" fill="none" stroke="#8a8377" stroke-width="2" marker-end="url(#m-gris)"/>
<rect x="1203.36" y="183" width="53.28" height="20" rx="5" fill="#0c0b09" stroke="#3a342a" stroke-width="0.8"/>
<text x="1230" y="197.2" text-anchor="middle"><tspan fill="#d8d0c2" font-size="12" font-weight="400">lecture</tspan></text>
<rect x="40" y="300" width="660" height="580" rx="12" fill="#100f0b" stroke="#8a8377" stroke-width="1.2"/>
<text x="56" y="322" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Node 2 (worker)</tspan><tspan fill="#a39c90" font-size="12" font-weight="400">   pods 10.42.1.0/24   kubelet, kube-proxy, cni0</tspan></text>
<rect x="900" y="300" width="660" height="580" rx="12" fill="#100f0b" stroke="#8a8377" stroke-width="1.2"/>
<text x="916" y="322" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Node 3 (worker)</tspan><tspan fill="#a39c90" font-size="12" font-weight="400">   pods 10.42.2.0/24   kubelet, kube-proxy, cni0</tspan></text>
<rect x="56" y="336" width="628" height="524" rx="12" fill="none" stroke="#8a8377" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="72" y="358" text-anchor="start"><tspan fill="#8a8377" font-size="12" font-weight="700">StatefulSet postgres-primaire (1 réplique)</tspan></text>
<rect x="916" y="336" width="628" height="524" rx="12" fill="none" stroke="#c0965e" stroke-width="3"/>
<text x="932" y="358" text-anchor="start"><tspan fill="#d9b886" font-size="12" font-weight="700">StatefulSet postgres-replique (1 réplique)</tspan></text>
<rect x="1460" y="325" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="1501.19" y="339.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
<rect x="72" y="372" width="596" height="290" rx="10" fill="#16140f" stroke="#8a8377" stroke-width="1.5"/>
<text x="88" y="396" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">Pod postgres-primaire-0</tspan><tspan fill="#d9b886" font-size="12" font-weight="400">  10.42.1.8 :5432</tspan></text>
<rect x="88" y="412" width="564" height="56" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="100" y="431" text-anchor="start"><tspan fill="#f3ebdd" font-size="12" font-weight="700">ConfigMap postgres-init (docker-entrypoint-initdb.d)</tspan></text>
<text x="100" y="450" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">crée le rôle replicateur et ajoute la ligne pg_hba</tspan></text>
<rect x="88" y="480" width="380" height="170" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="100" y="499" text-anchor="start"><tspan fill="#f3ebdd" font-size="12" font-weight="700">container postgres:17-alpine (primaire)</tspan></text>
<text x="100" y="518" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">wal_level=replica</tspan></text>
<text x="100" y="536" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">max_wal_senders=5</tspan></text>
<text x="100" y="554" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">max_replication_slots=5</tspan></text>
<text x="100" y="572" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">pg_hba : host replication replicateur</tspan></text>
<text x="100" y="590" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">lecture et écriture</tspan></text>
<rect x="488" y="512" width="164" height="60" rx="8" fill="#1d1a13" stroke="#c0965e" stroke-width="2.5"/>
<text x="500" y="531" text-anchor="start"><tspan fill="#d9b886" font-size="12" font-weight="700">walsender</tspan></text>
<text x="500" y="550" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">envoie le WAL</tspan></text>
<rect x="72" y="684" width="596" height="62" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="84" y="703" text-anchor="start"><tspan fill="#f3ebdd" font-size="12" font-weight="700">PVC data-postgres-primaire-0 : 100Mi</tspan></text>
<text x="84" y="722" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">monté dans /var/lib/postgresql/data (PGDATA : pgdata)</tspan></text>
<rect x="72" y="764" width="596" height="46" rx="9" fill="#12161a" stroke="#6f8fb0" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="82" y="783" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">Service headless </tspan><tspan fill="#f3ebdd" font-size="13" font-weight="700">postgres-primaire</tspan></text>
<text x="82" y="800" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">DNS : postgres-primaire-0.postgres-primaire</tspan></text>
<rect x="932" y="372" width="596" height="290" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="948" y="396" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">Pod postgres-replique-0</tspan><tspan fill="#d9b886" font-size="12" font-weight="400">  10.42.2.9 :5432</tspan></text>
<rect x="948" y="412" width="564" height="56" rx="8" fill="#1d1a13" stroke="#c0965e" stroke-width="2.5"/>
<text x="960" y="431" text-anchor="start"><tspan fill="#f3ebdd" font-size="12" font-weight="700">initContainer copie-du-primaire : pg_basebackup -R</tspan></text>
<text x="960" y="450" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">copie le primaire dans le volume, écrit standby.signal</tspan></text>
<rect x="948" y="512" width="164" height="60" rx="8" fill="#1d1a13" stroke="#c0965e" stroke-width="2.5"/>
<text x="960" y="531" text-anchor="start"><tspan fill="#d9b886" font-size="12" font-weight="700">walreceiver</tspan></text>
<text x="960" y="550" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">reçoit le WAL</tspan></text>
<rect x="1132" y="480" width="380" height="170" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="1144" y="499" text-anchor="start"><tspan fill="#f3ebdd" font-size="12" font-weight="700">container postgres:17-alpine (réplique)</tspan></text>
<text x="1144" y="518" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">hot_standby=on</tspan></text>
<text x="1144" y="536" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">pg_is_in_recovery() = true</tspan></text>
<text x="1144" y="554" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">lecture seule : rejoue le WAL reçu</tspan></text>
<text x="1144" y="572" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">réplication asynchrone</tspan></text>
<text x="1144" y="590" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">léger retard possible</tspan></text>
<rect x="932" y="684" width="596" height="62" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="944" y="703" text-anchor="start"><tspan fill="#f3ebdd" font-size="12" font-weight="700">PVC data-postgres-replique-0 : 100Mi</tspan></text>
<text x="944" y="722" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">monté dans /var/lib/postgresql/data (copie du primaire)</tspan></text>
<rect x="932" y="764" width="596" height="46" rx="9" fill="#12161a" stroke="#c0965e" stroke-width="3" stroke-dasharray="5 4"/>
<text x="942" y="783" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">Service headless </tspan><tspan fill="#f3ebdd" font-size="13" font-weight="700">postgres-replique</tspan></text>
<text x="942" y="800" text-anchor="start"><tspan fill="#9db6cf" font-size="12" font-weight="400">DNS : postgres-replique-0.postgres-replique</tspan></text>
<path d="M520,262 L520,372" fill="none" stroke="#6f8fb0" stroke-width="2" marker-end="url(#m-bleu)"/>
<path d="M1380,262 L1380,372" fill="none" stroke="#6f8fb0" stroke-width="2" marker-end="url(#m-bleu)"/>
<path d="M652,552 L948,552" fill="none" stroke="#c0965e" stroke-width="4" marker-end="url(#m-or)"/>
<text x="800" y="590" text-anchor="middle"><tspan fill="#f3ebdd" font-size="12" font-weight="700">flux WAL continu</tspan></text>
<text x="800" y="609" text-anchor="middle"><tspan fill="#d8d0c2" font-size="12" font-weight="400">TCP 5432</tspan></text>
<text x="800" y="628" text-anchor="middle"><tspan fill="#d8d0c2" font-size="12" font-weight="400">slot postgres_replique_0</tspan></text>
<text x="800" y="647" text-anchor="middle"><tspan fill="#d8d0c2" font-size="12" font-weight="400">utilisateur replicateur</tspan></text>
<text x="800" y="666" text-anchor="middle"><tspan fill="#d9b886" font-size="12" font-weight="400">asynchrone</tspan></text>
<path d="M652,524 L730,524 L730,440 L948,440" fill="none" stroke="#8a8377" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#m-gris)"/>
<text x="800" y="392" text-anchor="middle"><tspan fill="#f3ebdd" font-size="12" font-weight="700">copie initiale</tspan></text>
<text x="800" y="409" text-anchor="middle"><tspan fill="#d8d0c2" font-size="12" font-weight="400">pg_basebackup -R</tspan></text>
<text x="800" y="426" text-anchor="middle"><tspan fill="#d8d0c2" font-size="12" font-weight="400">avant le démarrage</tspan></text>
<rect x="40" y="900" width="500" height="168" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="54" y="924" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Rôles et lecture seule</tspan></text>
<path d="M40,934 L540,934" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="54" y="955" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">primaire : le back y écrit (Service postgres)</tspan></text>
<text x="54" y="974" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">réplique : lecture seule, via postgres-lecture</tspan></text>
<text x="54" y="993" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">pg_is_in_recovery() = true sur la réplique</tspan></text>
<text x="54" y="1012" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">asynchrone : l'écriture est validée sans attendre</tspan></text>
<text x="54" y="1031" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">la réplique, qui peut avoir un léger retard</tspan></text>
<rect x="560" y="900" width="500" height="168" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="574" y="924" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Réplication en flux</tspan></text>
<path d="M560,934 L1060,934" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="574" y="955" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">slot postgres_replique_0 : le primaire garde le WAL</tspan></text>
<text x="574" y="974" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">tant que la réplique ne l'a pas lu (disque limité)</tspan></text>
<text x="574" y="993" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">adresse du primaire pour la réplique :</tspan></text>
<text x="574" y="1012" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">postgres-primaire-0.postgres-primaire (headless)</tspan></text>
<rect x="976" y="889" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="1017.19" y="903.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
<rect x="1080" y="900" width="480" height="168" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="1094" y="924" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Secret postgres-secrets</tspan></text>
<path d="M1080,934 L1560,934" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="1094" y="955" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">POSTGRES_PASSWORD et REPLICATION_PASSWORD</tspan></text>
<text x="1094" y="974" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">lus par les deux StatefulSets (variables d'env.)</tspan></text>
<text x="1094" y="993" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">mots de passe jamais écrits dans le dépôt</tspan></text>
<path d="M40,1100 L74,1100" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<text x="84" y="1104" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">flux WAL continu</tspan></text>
<path d="M219.28,1100 L253.28,1100" fill="none" stroke="#8a8377" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m-gris)"/>
<text x="263.28" y="1104" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">copie initiale</tspan></text>
<path d="M372.52,1100 L406.52,1100" fill="none" stroke="#6f8fb0" stroke-width="2" marker-end="url(#m-bleu)"/>
<text x="416.52" y="1104" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">Service -&gt; pod (DNAT kube-proxy)</tspan></text>
<rect x="665.08" y="1092" width="34" height="16" rx="4" fill="#12161a" stroke="#6f8fb0" stroke-width="1.5"/>
<text x="709.08" y="1104" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">Service ClusterIP</tspan></text>
<rect x="853" y="1092" width="34" height="16" rx="4" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="897" y="1104" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">NOUVEAU : ajouté par ce défi</tspan></text>
<text x="40" y="1140" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">Si Node 2 tombe, la réplique garde une copie des données. IP de pods et de Services données à titre d'exemple.</tspan></text>
</svg>
