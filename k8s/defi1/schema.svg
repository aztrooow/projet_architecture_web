<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="1600" height="1130" font-family="Verdana, 'DejaVu Sans', 'Segoe UI', Arial, sans-serif">
<title>Défi 1 : premier Pod accessible par kubectl port-forward</title>
<defs>
<marker id="m-gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8377"/></marker>
<marker id="m-or" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0965e"/></marker>
</defs>
<rect width="1600" height="1130" rx="16" fill="#0c0b09"/>
<text x="50" y="46"><tspan fill="#c0965e" font-size="24" font-weight="600" letter-spacing="3">CINETINT</tspan><tspan dx="16" fill="#a39c90" font-size="15">défi 1 : un Deployment, un ReplicaSet, un Pod, et un tunnel kubectl port-forward</tspan></text>
<rect x="40" y="100" width="380" height="500" rx="14" fill="none" stroke="#8a8377" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="56" y="122" text-anchor="start"><tspan fill="#8a8377" font-size="12" font-weight="400">Poste du développeur (hors du cluster)</tspan></text>
<rect x="56" y="140" width="348" height="140" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="70" y="164" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Terminal 1 : kubectl</tspan></text>
<path d="M56,174 L404,174" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="70" y="195" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">kubectl create deployment csc8567</tspan></text>
<text x="70" y="214" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">  --image=xhelozs/csc8567:v1 -n u-XXX</tspan></text>
<text x="70" y="233" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">kubectl port-forward pods/csc8567-xxxx</tspan></text>
<text x="70" y="252" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">  8080:5000 -n u-XXX</tspan></text>
<rect x="56" y="330" width="348" height="96" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="70" y="354" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Processus kubectl port-forward</tspan></text>
<path d="M56,364 L404,364" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="70" y="385" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">écoute 127.0.0.1:8080</tspan></text>
<text x="70" y="404" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">relaie chaque connexion dans le tunnel</tspan></text>
<rect x="320" y="319" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="361.188" y="333.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
<rect x="56" y="480" width="348" height="84" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="70" y="504" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Navigateur ou curl</tspan></text>
<path d="M56,514 L404,514" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="70" y="535" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">http://localhost:8080/</tspan></text>
<path d="M230,280 L230,330" fill="none" stroke="#8a8377" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m-gris)"/>
<path d="M230,480 L230,426" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<circle cx="256" cy="453" r="11" fill="#c0965e"/>
<text x="256" y="457.2" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">1</text>
<rect x="460" y="100" width="1110" height="820" rx="14" fill="none" stroke="#8a8377" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="1554" y="122" text-anchor="end"><tspan fill="#8a8377" font-size="12" font-weight="400">Cluster Kubernetes RKE2, espace de noms u-XXX</tspan></text>
<rect x="480" y="130" width="440" height="770" rx="12" fill="#100f0b" stroke="#8a8377" stroke-width="1.2"/>
<text x="496" y="154" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Node 1 (master, control plane)</tspan></text>
<rect x="500" y="172" width="400" height="122" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="1.5"/>
<text x="514" y="196" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">API server</tspan></text>
<path d="M500,206 L900,206" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="514" y="227" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">:6443 HTTPS (kubeconfig, certificat)</tspan></text>
<text x="514" y="246" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">authentifie, autorise, valide</tspan></text>
<text x="514" y="265" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">écrit dans etcd, relaie le tunnel</tspan></text>
<rect x="500" y="306" width="400" height="56" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="510" y="324" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">etcd :2379</tspan></text>
<text x="510" y="342" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">base clé-valeur : l'état de tout le cluster</tspan></text>
<rect x="500" y="374" width="400" height="56" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="510" y="392" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">scheduler</tspan></text>
<text x="510" y="410" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">choisit le nœud de chaque nouveau pod</tspan></text>
<rect x="500" y="442" width="400" height="56" rx="8" fill="#1d1a13" stroke="#3a342a" stroke-width="1.5"/>
<text x="510" y="460" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">controller-manager</tspan></text>
<text x="510" y="478" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">boucles : Deployment, ReplicaSet, Pod...</tspan></text>
<rect x="496" y="514" width="408" height="372" rx="14" fill="none" stroke="#8a8377" stroke-width="1.2" stroke-dasharray="6 5"/>
<text x="510" y="536" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">Objets créés par kubectl create deployment</tspan></text>
<rect x="512" y="552" width="384" height="60" rx="8" fill="#1d1a13" stroke="#c0965e" stroke-width="3"/>
<text x="522" y="570" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">Deployment csc8567</tspan></text>
<text x="522" y="588" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">replicas 1, image xhelozs/csc8567:v1</tspan></text>
<rect x="812" y="541" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="853.188" y="555.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
<path d="M704,612 L704,662" fill="none" stroke="#8a8377" stroke-width="2" marker-end="url(#m-gris)"/>
<text x="720" y="642" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">controller-manager</tspan></text>
<rect x="512" y="662" width="384" height="60" rx="8" fill="#1d1a13" stroke="#c0965e" stroke-width="3"/>
<text x="522" y="680" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">ReplicaSet csc8567-6c9d5</tspan></text>
<text x="522" y="698" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">garde 1 pod en vie</tspan></text>
<rect x="812" y="651" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="853.188" y="665.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
<path d="M704,722 L704,772" fill="none" stroke="#8a8377" stroke-width="2" marker-end="url(#m-gris)"/>
<text x="720" y="752" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">scheduler : Node 2</tspan></text>
<rect x="512" y="772" width="384" height="60" rx="8" fill="#1d1a13" stroke="#c0965e" stroke-width="3"/>
<text x="522" y="790" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">Pod csc8567-6c9d5-x2k4p</tspan></text>
<text x="522" y="808" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">créé, puis placé sur Node 2</tspan></text>
<rect x="812" y="761" width="82.376" height="20" rx="10" fill="#c0965e"/>
<text x="853.188" y="775.5" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">NOUVEAU</text>
<rect x="1000" y="130" width="560" height="770" rx="12" fill="#100f0b" stroke="#8a8377" stroke-width="1.2"/>
<text x="1016" y="154" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Node 2 (worker)</tspan><tspan fill="#a39c90" font-size="12" font-weight="400">   pods 10.42.1.0/24</tspan></text>
<rect x="1020" y="172" width="520" height="122" rx="10" fill="#16140f" stroke="#c0965e" stroke-width="1.5"/>
<text x="1034" y="196" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">kubelet</tspan></text>
<text x="1526" y="196" text-anchor="end"><tspan fill="#a39c90" font-size="12" font-weight="400">:10250</tspan></text>
<path d="M1020,206 L1540,206" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="1034" y="227" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">lance les conteneurs (containerd)</tspan></text>
<text x="1034" y="246" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">ouvre le flux du port-forward vers le pod</tspan></text>
<text x="1034" y="265" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">voit le nouveau pod en surveillant l'API server</tspan></text>
<rect x="1020" y="340" width="520" height="270" rx="10" fill="#16140f" stroke="#8a8377" stroke-width="1.5"/>
<text x="1036" y="364" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Pod csc8567-6c9d5-x2k4p</tspan><tspan fill="#d9b886" font-size="12" font-weight="400">   10.42.1.14</tspan></text>
<rect x="1036" y="384" width="488" height="78" rx="8" fill="#1d1a13" stroke="#c0965e" stroke-width="1.5"/>
<text x="1046" y="402" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">espace de noms réseau du pod</tspan></text>
<text x="1046" y="420" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">une seule IP : 10.42.1.14</tspan></text>
<text x="1046" y="437" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">127.0.0.1 désigne le pod lui-même</tspan></text>
<rect x="1036" y="482" width="488" height="100" rx="8" fill="#1d1a13" stroke="#c0965e" stroke-width="1.5"/>
<text x="1046" y="500" text-anchor="start"><tspan fill="#f3ebdd" font-size="13" font-weight="700">conteneur Flask</tspan></text>
<text x="1046" y="518" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">image xhelozs/csc8567:v1</tspan></text>
<text x="1046" y="535" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">écoute sur le port 5000</tspan></text>
<text x="1046" y="552" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">sans requests ni limits (défi 1)</tspan></text>
<rect x="1020" y="650" width="520" height="10" rx="4" fill="#d9b886" opacity="0.45"/>
<text x="1030" y="686" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">pont cni0 : le pod y est branché par une paire veth</tspan></text>
<path d="M404,378 L440,378 L440,232 L500,232" fill="none" stroke="#c0965e" stroke-width="3" marker-end="url(#m-or)"/>
<circle cx="440" cy="306" r="11" fill="#c0965e"/>
<text x="440" y="310.2" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">2</text>
<path d="M900,232 L1020,232" fill="none" stroke="#c0965e" stroke-width="3" marker-end="url(#m-or)"/>
<circle cx="960" cy="212" r="11" fill="#c0965e"/>
<text x="960" y="216.2" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">3</text>
<path d="M1420,294 L1420,384" fill="none" stroke="#c0965e" stroke-width="3" marker-end="url(#m-or)"/>
<circle cx="1446" cy="330" r="11" fill="#c0965e"/>
<text x="1446" y="334.2" text-anchor="middle" fill="#0c0b09" font-size="12" font-weight="700">4</text>
<path d="M896,802 L960,802 L960,272 L1020,272" fill="none" stroke="#8a8377" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m-gris)"/>
<rect x="40" y="940" width="760" height="126" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="54" y="964" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">Le tunnel pas à pas</tspan></text>
<path d="M40,974 L800,974" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="54" y="995" text-anchor="start"><tspan fill="#c0965e" font-size="12" font-weight="700">1  </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">curl parle à 127.0.0.1:8080, où kubectl écoute</tspan></text>
<text x="54" y="1014" text-anchor="start"><tspan fill="#c0965e" font-size="12" font-weight="700">2  </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">kubectl ouvre un flux HTTPS vers l'API server (:6443, Node 1)</tspan></text>
<text x="54" y="1033" text-anchor="start"><tspan fill="#c0965e" font-size="12" font-weight="700">3  </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">l'API server le relaie au kubelet du nœud qui porte le pod (:10250)</tspan></text>
<text x="54" y="1052" text-anchor="start"><tspan fill="#c0965e" font-size="12" font-weight="700">4  </tspan><tspan fill="#d8d0c2" font-size="12" font-weight="400">le kubelet se connecte au port 5000 dans l'espace réseau du pod</tspan></text>
<rect x="830" y="940" width="730" height="126" rx="10" fill="#16140f" stroke="#3a342a" stroke-width="1.5"/>
<text x="844" y="964" text-anchor="start"><tspan fill="#f3ebdd" font-size="14" font-weight="700">À retenir</tspan></text>
<path d="M830,974 L1560,974" fill="none" stroke="#3a342a" stroke-width="1"/>
<text x="844" y="995" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">pas de Service ni d'Ingress : c'est un accès de test</tspan></text>
<text x="844" y="1014" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">le trafic passe par l'API server, pas par le réseau des pods</tspan></text>
<text x="844" y="1033" text-anchor="start"><tspan fill="#a39c90" font-size="12" font-weight="400">un seul pod : supprimé, il revient avec une autre IP et il faut relancer le tunnel</tspan></text>
<path d="M40,1096 L74,1096" fill="none" stroke="#c0965e" stroke-width="2" marker-end="url(#m-or)"/>
<text x="84" y="1100" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">flux du tunnel</tspan></text>
<path d="M201.28,1096 L235.28,1096" fill="none" stroke="#8a8377" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#m-gris)"/>
<text x="245.28" y="1100" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">le kubelet observe l'API server</tspan></text>
<rect x="469.84" y="1088" width="34" height="16" rx="4" fill="#16140f" stroke="#c0965e" stroke-width="3"/>
<text x="513.84" y="1100" text-anchor="start"><tspan fill="#d8d0c2" font-size="12" font-weight="400">NOUVEAU : créé par ce défi</tspan></text>
</svg>
