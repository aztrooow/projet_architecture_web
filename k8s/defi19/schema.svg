<text x="1310" y="222.5" text-anchor="middle" fill="#0c0b09" font-size="13" font-weight="700">3</text>
<path d="M1445,350 L1445,420" fill="none" stroke="#c0965e" stroke-width="3" marker-end="url(#m-or)"/>
<path d="M1445,368 L1462,385 L1445,402 L1428,385 z" fill="#c0965e" stroke="#0c0b09" stroke-width="2"/>
